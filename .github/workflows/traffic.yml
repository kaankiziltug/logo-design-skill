name: Traffic archive

# GitHub keeps traffic stats for only 14 days. This saves them every day to
# the private repo in DATA_REPO, whose README is the dashboard.
#
# Needs a repo secret TRAFFIC_TOKEN: a fine-grained personal access token for
# this repo with "Administration: Read-only" (the default GITHUB_TOKEN can't
# read traffic) and for DATA_REPO with "Contents: Read and write".

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: traffic-archive
  cancel-in-progress: false

env:
  DATA_REPO: ${{ github.repository }}-traffic

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: src
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ env.DATA_REPO }}
          token: ${{ secrets.TRAFFIC_TOKEN }}
          path: data
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.x"
      - name: Collect traffic
        env:
          TRAFFIC_TOKEN: ${{ secrets.TRAFFIC_TOKEN }}
        run: python src/tools/traffic/collect.py --repo "$GITHUB_REPOSITORY" --out data
      - name: Build dashboard
        run: python src/tools/traffic/report.py --data data --repo "$GITHUB_REPOSITORY"
      - name: Commit
        working-directory: data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Traffic $(date -u +%F)"
          git push

<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1020" viewBox="0 0 1600 1020">
  <rect width="1600" height="1020" fill="#F2EFE9"/>
  <text x="56" y="46" font-family="Hind Vadodara" font-size="12" letter-spacing="1.8" fill="#3A4C40" opacity=".6">SIZE TEST — RENDERED AT EXACT PIXEL SIZE, THEN ENLARGED 8× (NEAREST NEIGHBOUR)</text>
  <text x="56" y="80" font-family="Hind Vadodara" font-size="23" fill="#3A4C40">The master holds to 32 px; below that use the small cut</text><text x="56" y="130" font-family="Hind Vadodara" font-size="13" fill="#3A4C40">Master — stroke 28/256</text><image x="56" y="146" width="256" height="256" href="data:image/png;base64," image-rendering="pixelated"/><text x="56" y="420" font-family="Hind Vadodara" font-size="11" fill="#3A4C40" opacity=".55">64 px · 4× zoom</text><image x="328" y="146" width="64" height="64" href="data:image/png;base64,"/><text x="328" y="228" font-family="Hind Vadodara" font-size="10.5" fill="#3A4C40" opacity=".4">true size</text><image x="420" y="146" width="192" height="192" href="data:image/png;base64," image-rendering="pixelated"/><text x="420" y="356" font-family="Hind Vadodara" font-size="11" fill="#3A4C40" opacity=".55">32 px · 6× zoom</text><image x="628" y="146" width="32" height="32" href="data:image/png;base64,"/><text x="628" y="196" font-family="Hind Vadodara" font-size="10.5" fill="#3A4C40" opacity=".4">true size</text><image x="700" y="146" width="128" height="128" href="data:image/png;base64," image-rendering="pixelated"/><text x="700" y="292" font-family="Hind Vadodara" font-size="11" fill="#3A4C40" opacity=".55">16 px · 8× zoom</text><image x="844" y="146" width="16" height="16" href="data:image/png;base64,"/><text x="844" y="180" font-family="Hind Vadodara" font-size="10.5" fill="#3A4C40" opacity=".4">true size</text><text x="56" y="520" font-family="Hind Vadodara" font-size="13" fill="#3A4C40">Small cut — stroke 44/256 · arms closer · shorter deck</text><image x="56" y="536" width="256" height="256" href="data:image/png;base64," image-rendering="pixelated"/><text x="56" y="810" font-family="Hind Vadodara" font-size="11" fill="#3A4C40" opacity=".55">64 px · 4× zoom</text><image x="328" y="536" width="64" height="64" href="data:image/png;base64,"/><text x="328" y="618" font-family="Hind Vadodara" font-size="10.5" fill="#3A4C40" opacity=".4">true size</text><image x="420" y="536" width="192" height="192" href="data:image/png;base64," image-rendering="pixelated"/><text x="420" y="746" font-family="Hind Vadodara" font-size="11" fill="#3A4C40" opacity=".55">32 px · 6× zoom</text><image x="628" y="536" width="32" height="32" href="data:image/png;base64,"/><text x="628" y="586" font-family="Hind Vadodara" font-size="10.5" fill="#3A4C40" opacity=".4">true size</text><image x="700" y="536" width="128" height="128" href="data:image/png;base64," image-rendering="pixelated"/><text x="700" y="682" font-family="Hind Vadodara" font-size="11" fill="#3A4C40" opacity=".55">16 px · 8× zoom</text><image x="844" y="536" width="16" height="16" href="data:image/png;base64,"/><text x="844" y="570" font-family="Hind Vadodara" font-size="10.5" fill="#3A4C40" opacity=".4">true size</text><text x="56" y="880" font-family="Hind Vadodara" font-size="12" letter-spacing="1.6" fill="#C4694A">WHAT BREAKS AT SMALL SIZES</text><circle cx="62" cy="910" r="3.2" fill="#C4694A"/><text x="80" y="915" font-family="Hind Vadodara" font-size="14" fill="#3A4C40" opacity=".85">The notch between deck and lower arm goes first: at 16 px the master’s 28-unit gap lands on 1.75 px and greys into one blob.</text><circle cx="62" cy="938" r="3.2" fill="#C4694A"/><text x="80" y="943" font-family="Hind Vadodara" font-size="14" fill="#3A4C40" opacity=".85">Rounded caps lose their radius below 24 px and the mark reads hard-edged — acceptable, as long as the two levels survive.</text><circle cx="62" cy="966" r="3.2" fill="#C4694A"/><text x="80" y="971" font-family="Hind Vadodara" font-size="14" fill="#3A4C40" opacity=".85">Keep at least 14 % of the deck width overhanging past the riser, or the shape collapses into a plain T.</text><circle cx="62" cy="994" r="3.2" fill="#C4694A"/><text x="80" y="999" font-family="Hind Vadodara" font-size="14" fill="#3A4C40" opacity=".85">Never scale the master down to 16 px. Swap to the small cut at 24 px and below; below 40 px total width, drop the wordmark.</text></svg>